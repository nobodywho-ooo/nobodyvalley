[project]
name = "nobodyvalley-agents"
version = "0.1.0"
description = "LLM farmers for Stardew Valley co-op, powered by NobodyWho"
requires-python = ">=3.13"
dependencies = [
    "nobodywho>=5.0.0",
    "openai>=1.0.0",  # remote backend: Qwen3.8-Flash-Next on the ASCENTs (../on-prem)
    "pywebview>=6.2.1",
]

[project.scripts]
nobodyvalley = "nobodyvalley.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nobodyvalley"]
