[project]
name = "nw-valley-agents"
version = "0.1.0"
description = "LLM farmers for Stardew Valley co-op, powered by NobodyWho"
requires-python = ">=3.13"
dependencies = [
    "nobodywho>=5.0.0",
]

[project.scripts]
nw-valley = "nw_valley.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nw_valley"]
